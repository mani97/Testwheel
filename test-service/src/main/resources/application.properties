# --- Core Application ---
spring.application.name=test-service
server.port=9097

# --- Database (PostgreSQL) ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgres:5432/testservice
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.sql.init.platform=postgres
spring.jpa.defer-datasource-initialization=true

# --- Eureka client config ---
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/

# --- Thymeleaf ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# --- File Uploads ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# --- Kafka Consumer ---
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=test-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# --- Kafka Producer ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# --- External Integrations (placeholders) ---
twilio.account-sid=#
twilio.auth-token=#
twilio.phone-number=#

spring.security.oauth2.client.registration.google.client-id=#
spring.security.oauth2.client.registration.google.client-secret=#
spring.security.oauth2.client.registration.google.scope=#
spring.security.oauth2.client.registration.google.redirect-uri=#
spring.security.oauth2.client.registration.google.client-name=#

spring.security.oauth2.client.registration.github.client-id=#
spring.security.oauth2.client.registration.github.client-secret=#
spring.security.oauth2.client.registration.github.scope=#
spring.security.oauth2.client.registration.github.redirect-uri=#
spring.security.oauth2.client.registration.github.client-name=#
