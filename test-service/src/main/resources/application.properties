# --- Core Application ---
spring.application.name=${SPRING_APPLICATION_NAME:test-service}
server.port=${SERVER_PORT:9097}

# Graceful shutdown (Factor IX Disposability)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Respect proxy headers (important if behind API Gateway / Nginx / Traefik)
server.forward-headers-strategy=framework
# Ensure relative redirects (no container hostname leaks)
server.tomcat.use-relative-redirects=true

# --- Eureka client config ---
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://service-registry:8761/eureka/}

# --- Database (PostgreSQL) ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/testservice}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.platform=postgres
spring.jpa.defer-datasource-initialization=true

# --- Thymeleaf ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# --- File Uploads ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# --- Kafka Consumer ---
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=test-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# --- Kafka Producer ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# Circuit Breaker - testServiceCB
resilience4j.circuitbreaker.instances.testServiceCB.slidingWindowSize=5
resilience4j.circuitbreaker.instances.testServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.testServiceCB.waitDurationInOpenState=10s

# Circuit Breaker - apkServiceCB
resilience4j.circuitbreaker.instances.apkServiceCB.slidingWindowSize=5
resilience4j.circuitbreaker.instances.apkServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.apkServiceCB.waitDurationInOpenState=10s

# Retry - testServiceCB
resilience4j.retry.instances.testServiceCB.maxAttempts=3
resilience4j.retry.instances.testServiceCB.waitDuration=2s

# Retry - apkServiceCB
resilience4j.retry.instances.apkServiceCB.maxAttempts=3
resilience4j.retry.instances.apkServiceCB.waitDuration=2s

# Bulkhead - testServiceCB
resilience4j.bulkhead.instances.testServiceCB.maxThreadPoolSize=5
resilience4j.bulkhead.instances.testServiceCB.coreThreadPoolSize=2

# Bulkhead - apkServiceCB
resilience4j.bulkhead.instances.apkServiceCB.maxThreadPoolSize=5
resilience4j.bulkhead.instances.apkServiceCB.coreThreadPoolSize=2

# RateLimiter - testServiceCB
resilience4j.ratelimiter.instances.testServiceCB.limitForPeriod=10
resilience4j.ratelimiter.instances.testServiceCB.limitRefreshPeriod=1s

# RateLimiter - apkServiceCB
resilience4j.ratelimiter.instances.apkServiceCB.limitForPeriod=10
resilience4j.ratelimiter.instances.apkServiceCB.limitRefreshPeriod=1s


# --- External Integrations (placeholders) ---
twilio.account-sid=${TWILIO_ACCOUNT_SID:#}
twilio.auth-token=${TWILIO_AUTH_TOKEN:#}
twilio.phone-number=${TWILIO_PHONE_NUMBER:#}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:#}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:#}
spring.security.oauth2.client.registration.google.scope=#
spring.security.oauth2.client.registration.google.redirect-uri=#
spring.security.oauth2.client.registration.google.client-name=#

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:#}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:#}
spring.security.oauth2.client.registration.github.scope=#
spring.security.oauth2.client.registration.github.redirect-uri=#
spring.security.oauth2.client.registration.github.client-name=#

