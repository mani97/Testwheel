# --- Core Application ---
spring.application.name=${SPRING_APPLICATION_NAME:test-wheel}
server.port=${SERVER_PORT:9098}
server.forward-headers-strategy=framework
server.tomcat.use-relative-redirects=true

# Graceful shutdown (Factor IX Disposability)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- JWT Signing Secret (Factor III Config) ---
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# --- Eureka client config ---
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://service-registry:8761/eureka/}

# --- Database (PostgreSQL) ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/internapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.platform=postgres
spring.jpa.defer-datasource-initialization=true

# --- Thymeleaf ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# --- Session Timeout ---
server.servlet.session.timeout=5m

# --- File Uploads ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# --- Kafka Producer ---
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.retries=3
spring.kafka.producer.properties.spring.json.add.type.headers=false

# --- Kafka Consumer ---
spring.kafka.consumer.group-id=service-a-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# --- AWS S3 (Factor III & IV) ---
aws.s3.bucket-name=${AWS_S3_BUCKET:my-apk-bucket}
aws.region=${AWS_REGION:ap-south-1}
aws.access-key=${AWS_ACCESS_KEY_ID:YOUR_AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:YOUR_AWS_SECRET_KEY}

# --- External Integrations (placeholders) ---
twilio.account-sid=${TWILIO_ACCOUNT_SID:#}
twilio.auth-token=${TWILIO_AUTH_TOKEN:#}
twilio.phone-number=${TWILIO_PHONE_NUMBER:#}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:#}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:#}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:9098/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:#}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:#}
spring.security.oauth2.client.registration.github.scope=read:user
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:9098/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-name=GitHub

