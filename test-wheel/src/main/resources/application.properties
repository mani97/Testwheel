# --- Core Application ---
spring.application.name=test-wheel
server.port=9098

# --- Database (PostgreSQL) ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgres:5432/internapp
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.sql.init.platform=postgres
spring.jpa.defer-datasource-initialization=true

# --- Eureka client config ---
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/

# --- Thymeleaf ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# --- Session Timeout ---
server.servlet.session.timeout=5m

# --- File Uploads ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# --- Kafka Producer ---
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.retries=3
spring.kafka.producer.properties.spring.json.add.type.headers=false

# --- Kafka Consumer ---
spring.kafka.consumer.group-id=service-a-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# --- AWS S3 (placeholders) ---
aws.s3.bucket-name=my-apk-bucket
aws.region=ap-south-1
aws.access-key=YOUR_AWS_ACCESS_KEY
aws.secret-key=YOUR_AWS_SECRET_KEY

# --- External Integrations (placeholders) ---
twilio.account-sid=#
twilio.auth-token=#
twilio.phone-number=#

spring.security.oauth2.client.registration.google.client-id=#
spring.security.oauth2.client.registration.google.client-secret=#
spring.security.oauth2.client.registration.google.scope=#
spring.security.oauth2.client.registration.google.redirect-uri=#
spring.security.oauth2.client.registration.google.client-name=#

spring.security.oauth2.client.registration.github.client-id=#
spring.security.oauth2.client.registration.github.client-secret=#
spring.security.oauth2.client.registration.github.scope=#
spring.security.oauth2.client.registration.github.redirect-uri=#
spring.security.oauth2.client.registration.github.client-name=#
