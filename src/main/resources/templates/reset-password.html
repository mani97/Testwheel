<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center">Reset Your Password</h2>

    <!-- Alerts -->
    <div th:if="${signinError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${signinSuccess}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Reset Form -->
    <form th:action="@{/reset-password}" method="post" th:object="${Reset}">
        <input type="hidden" th:field="*{phone}">

        <div class="mb-3">
            <label for="newPassword" class="form-label">New Password</label>
            <input type="password" th:field="*{newPassword}" class="form-control" id="newPassword" required>
            <div th:if="${#fields.hasErrors('newPassword')}" class="text-danger"
                 th:errors="*{newPassword}"></div>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" th:field="*{confirmPassword}" class="form-control" id="confirmPassword" required>
            <div th:if="${#fields.hasErrors('confirmPassword')}" class="text-danger"
                 th:errors="*{confirmPassword}"></div>
        </div>

        <button type="submit" class="btn btn-success w-100">Reset Password</button>
    </form>
</div>
</body>
</html>
