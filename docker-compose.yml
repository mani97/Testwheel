version: "3.9"

services:
  service-registry:
    build: ./service-registry
    image: TestWheel/service-registry:${SERVICE_REGISTRY_VERSION}
    env_file:
      - .env
    ports:
      - "${SERVICE_REGISTRY_PORT:-28761}:8761"
    environment:
      SPRING_APPLICATION_NAME: service-registry
      SERVER_PORT: ${EUREKA_PORT}
      EUREKA_INSTANCE_HOSTNAME: ${EUREKA_HOST}
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/eureka/apps" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./api-gateway
    image: TestWheel/api-gateway:${API_GATEWAY_VERSION}
    env_file:
      - .env
    ports:
      - "${API_GATEWAY_HOST_PORT:-28765}:${API_GATEWAY_PORT}"
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SERVER_PORT: ${API_GATEWAY_PORT}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}

  test-wheel:
    build: ./test-wheel
    image: TestWheel/test-wheel:${TEST_WHEEL_VERSION}
    env_file:
      - .env
    ports:
      - "${TEST_WHEEL_HOST_PORT:-29098}:${TEST_WHEEL_PORT}"
    environment:
      SPRING_APPLICATION_NAME: spring-security
      SERVER_PORT: ${TEST_WHEEL_PORT}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OAUTH2_REDIRECT_BASE_URL: ${OAUTH2_REDIRECT_BASE_URL:-http://localhost:28765}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      service-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  test-service:
    build: ./test-service
    image: TestWheel/test-service:${TEST_SERVICE_VERSION}
    env_file:
      - .env
    ports:
      - "${TEST_SERVICE_HOST_PORT:-29097}:${TEST_SERVICE_PORT}"
    environment:
      SPRING_APPLICATION_NAME: test-service
      SERVER_PORT: ${TEST_SERVICE_PORT}
      SPRING_DATASOURCE_URL: ${TEST_SERVICE_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
        service-registry:
          condition: service_healthy
        postgres:
          condition: service_healthy
        kafka:
          condition: service_started

  postgres:
    image: postgres:${POSTGRES_VERSION}
    env_file:
      - .env
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:${POSTGRES_PORT}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-internapp}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:${ZOOKEEPER_VERSION}
    env_file:
      - .env
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:${KAFKA_VERSION}
    depends_on:
      - zookeeper
    env_file:
      - .env
    ports:
      - "${KAFKA_HOST_PORT:-29092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    env_file:
      - .env
    ports:
      - "${PGADMIN_HOST_PORT:-8081}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - postgres

volumes:
  postgres-data:
